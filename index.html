<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>황금비 자동 계산기</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .calculator {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f3f5;
            border-radius: 8px;
        }
        .ratio {
            font-size: 1.3rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 10px;
        }
        .message {
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }
        /* 상태별 텍스트 색상 */
        .default { color: #6c757d; }
        .golden { color: #20c997; }
        .close { color: #fd7e14; }
        .not-golden { color: #fa5252; }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>황금비 계산기</h2>
        
        <div class="input-group">
            <label for="width">가로 길이</label>
            <input type="number" id="width" placeholder="예: 1618" oninput="calculateRatio()">
        </div>
        <div class="input-group">
            <label for="height">세로 길이</label>
            <input type="number" id="height" placeholder="예: 1000" oninput="calculateRatio()">
        </div>

        <div class="result-box">
            <div class="ratio" id="ratioResult">비율: -</div>
            <div class="message default" id="feedbackMessage">길이를 입력해주세요.</div>
        </div>
    </div>

    <script>
        function calculateRatio() {
            // 입력값 가져오기
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const ratioResult = document.getElementById('ratioResult');
            const feedbackMessage = document.getElementById('feedbackMessage');

            // 유효성 검사 (숫자가 아니거나 0 이하일 경우)
            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                ratioResult.textContent = '비율: -';
                feedbackMessage.textContent = '올바른 길이를 입력해주세요.';
                feedbackMessage.className = 'message default';
                return;
            }

            // 긴 변과 짧은 변을 구분하여 비율 계산
            const longSide = Math.max(width, height);
            const shortSide = Math.min(width, height);
            const ratio = longSide / shortSide;

            // 계산된 비율 출력 (소수점 3자리까지)
            ratioResult.textContent = `1 : ${ratio.toFixed(3)}`;

            // 황금비 (1.618) 판단 로직
            const goldenRatio = 1.618;
            const difference = Math.abs(ratio - goldenRatio);

            // 오차 범위에 따른 결과 메시지 출력
            if (difference <= 0.02) {
                feedbackMessage.textContent = '✨ 완벽한 황금비입니다!';
                feedbackMessage.className = 'message golden';
            } else if (difference <= 0.15) {
                feedbackMessage.textContent = '👍 황금비에 근접했습니다.';
                feedbackMessage.className = 'message close';
            } else {
                feedbackMessage.textContent = '❌ 황금비가 아닙니다.';
                feedbackMessage.className = 'message not-golden';
            }
        }
    </script>

</body>
</html>
