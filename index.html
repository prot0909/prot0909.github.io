<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 계산기 (기본 & 황금비)</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
        }
        
        .app-container {
            position: relative;
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            min-height: 400px;
            overflow: hidden;
        }

        /* 전환 버튼 (우측 상단) */
        .toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .toggle-btn:hover {
            background-color: #e2e6ea;
            transform: scale(1.03);
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 20px;
            color: #343a40;
            font-size: 1.4rem;
            text-align: center;
        }

        /* ---------------- 전환 애니메이션 ---------------- */
        .animated-view {
            animation: fadeInSlide 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------------- 기본 계산기 스타일 ---------------- */
        #basicCalcScreen {
            width: 100%;
            height: 60px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 2rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            color: #212529;
            outline: none;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .keypad button {
            padding: 15px 0;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #f1f3f5;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        
        .keypad button:active {
            transform: scale(0.95);
        }

        .keypad button:hover {
            background-color: #e2e6ea;
        }
        
        .keypad button.operator {
            background-color: #ffe8cc;
            color: #d9480f;
            font-weight: bold;
        }
        .keypad button.operator:hover {
            background-color: #ffd8a8;
        }
        
        .keypad button.equal {
            background-color: #339af0;
            color: white;
            grid-column: span 2;
        }
        .keypad button.equal:hover {
            background-color: #228be6;
        }
        
        .keypad button.clear {
            background-color: #ffc9c9;
            color: #c92a2a;
        }
        .keypad button.clear:hover {
            background-color: #ffa8a8;
        }

        /* ---------------- 황금비 계산기 스타일 ---------------- */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #495057;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #339af0;
        }

        .calc-btn {
            width: 100%;
            padding: 12px;
            background-color: #339af0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .calc-btn:hover {
            background-color: #228be6;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        .ratio {
            font-size: 1.2rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 10px;
        }
        .message {
            font-size: 1rem;
            font-weight: bold;
        }
        
        .default { color: #868e96; }
        .golden { color: #20c997; }
        .silver { color: #748ffc; } /* 금강비 전용 색상 추가 (파란계열) */
        .close { color: #fd7e14; }
        .not-golden { color: #fa5252; }
    </style>
</head>
<body>

    <div class="app-container">
        <button class="toggle-btn" id="toggleModeBtn" onclick="toggleMode()">황금비 계산기 🔄</button>

        <div id="basicCalculator" class="animated-view">
            <h2>계산기</h2>
            <input type="text" id="basicCalcScreen" readonly placeholder="0">
            
            <div class="keypad">
                <button class="clear" onclick="clearScreen()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('/')">÷</button>
                
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>
                
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">-</button>
                
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculateBasic()">=</button>
            </div>
        </div>

        <div id="goldenCalculator" style="display: none;">
            <h2>황금비 계산기</h2>
            
            <div class="input-group">
                <label for="width">가로 길이</label>
                <input type="number" id="width" placeholder="예: 1618 혹은 1414">
            </div>
            <div class="input-group">
                <label for="height">세로 길이</label>
                <input type="number" id="height" placeholder="예: 1000">
            </div>

            <button class="calc-btn" onclick="calculateGoldenRatio()">계산하기</button>

            <div class="result-box">
                <div class="ratio" id="ratioResult">비율: -</div>
                <div class="message default" id="feedbackMessage">길이를 입력하고 버튼을 눌러주세요.</div>
            </div>
        </div>
    </div>

    <script>
        let isBasicMode = true;

        function toggleMode() {
            const basicDiv = document.getElementById('basicCalculator');
            const goldenDiv = document.getElementById('goldenCalculator');
            const toggleBtn = document.getElementById('toggleModeBtn');

            isBasicMode = !isBasicMode;

            // 기존 애니메이션 클래스 초기화
            basicDiv.classList.remove('animated-view');
            goldenDiv.classList.remove('animated-view');

            if (isBasicMode) {
                goldenDiv.style.display = 'none';
                basicDiv.style.display = 'block';
                // 리플로우 강제 트리거 후 애니메이션 클래스 재적용
                void basicDiv.offsetWidth; 
                basicDiv.classList.add('animated-view');
                toggleBtn.textContent = '황금비 계산기 🔄';
            } else {
                basicDiv.style.display = 'none';
                goldenDiv.style.display = 'block';
                void goldenDiv.offsetWidth;
                goldenDiv.classList.add('animated-view');
                toggleBtn.textContent = '기본 계산기 🔄';
            }
        }

        // 기본 계산기 로직
        const screen = document.getElementById('basicCalcScreen');

        function appendValue(value) {
            if (screen.value === 'Error') screen.value = '';
            screen.value += value;
        }

        function clearScreen() {
            screen.value = '';
        }

        function calculateBasic() {
            if (screen.value.trim() === '') return;
            try {
                const result = new Function('return ' + screen.value)(); 
                screen.value = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, '');
            } catch (error) {
                screen.value = 'Error';
            }
        }

        // 황금/금강비 계산기 로직
        function calculateGoldenRatio() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const ratioResult = document.getElementById('ratioResult');
            const feedbackMessage = document.getElementById('feedbackMessage');

            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                ratioResult.textContent = '비율: -';
                feedbackMessage.textContent = '올바른 길이를 입력해주세요.';
                feedbackMessage.className = 'message default';
                return;
            }

            const longSide = Math.max(width, height);
            const shortSide = Math.min(width, height);
            const ratio = longSide / shortSide;

            ratioResult.textContent = `1 : ${ratio.toFixed(3)}`;

            const goldenRatio = 1.618;
            const silverRatio = 1.414; // 금강비 추가
            
            const goldenDiff = Math.abs(ratio - goldenRatio);
            const silverDiff = Math.abs(ratio - silverRatio);

            // 0.001 이하의 미세한 오차는 완벽한 일치로 간주
            if (goldenDiff <= 0.001) {
                feedbackMessage.textContent = '✨ 완벽한 황금비입니다!';
                feedbackMessage.className = 'message golden';
            } else if (silverDiff <= 0.001) {
                feedbackMessage.textContent = '💎 완벽한 금강비입니다!';
                feedbackMessage.className = 'message silver';
            } 
            // 황금비와 금강비 중 어느 쪽에 더 가까운지 판별하여 메시지 출력
            else if (goldenDiff <= 0.15 && goldenDiff < silverDiff) {
                feedbackMessage.textContent = '👍 황금비에 근접했습니다.';
                feedbackMessage.className = 'message close';
            } else if (silverDiff <= 0.15 && silverDiff < goldenDiff) {
                feedbackMessage.textContent = '👍 금강비에 근접했습니다.';
                feedbackMessage.className = 'message close';
            } else {
                feedbackMessage.textContent = '❌ 황금비/금강비가 아닙니다.';
                feedbackMessage.className = 'message not-golden';
            }
        }
    </script>

</body>
</html>
