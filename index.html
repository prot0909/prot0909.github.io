<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>황금비 계산기</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
        }
        
        .app-container {
            position: relative;
            background: #ffffff;
            padding: 2rem 1.8rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 330px;
            min-height: 480px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 상단 3단 탭 네비게이션 */
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 4px;
            border-radius: 10px;
        }
        
        .nav-tab {
            flex: 1;
            padding: 8px 0;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: #212529;
        }

        .nav-tab.active {
            background: #ffffff;
            color: #339af0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #343a40;
            font-size: 1.3rem;
            text-align: center;
        }

        /* ---------------- 전환 애니메이션 ---------------- */
        .animated-view {
            animation: fadeInSlide 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------------- 기본 계산기 스타일 ---------------- */
        #basicCalcScreen {
            width: 100%;
            height: 55px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1.8rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
            color: #212529;
            outline: none;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .keypad button {
            padding: 14px 0;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            background-color: #f1f3f5;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        
        .keypad button:active {
            transform: scale(0.95);
        }

        .keypad button:hover {
            background-color: #e2e6ea;
        }
        
        .keypad button.operator {
            background-color: #ffe8cc;
            color: #d9480f;
            font-weight: bold;
        }
        .keypad button.operator:hover {
            background-color: #ffd8a8;
        }
        
        .keypad button.equal {
            background-color: #339af0;
            color: white;
            grid-column: span 2;
        }
        .keypad button.equal:hover {
            background-color: #228be6;
        }
        
        .keypad button.clear {
            background-color: #ffc9c9;
            color: #c92a2a;
        }
        .keypad button.clear:hover {
            background-color: #ffa8a8;
        }

        /* ---------------- 입력 및 결과 공통 스타일 ---------------- */
        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            background-color: white;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #339af0;
        }

        .calc-btn {
            width: 100%;
            padding: 11px;
            background-color: #339af0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .calc-btn:hover {
            background-color: #228be6;
        }
        .calc-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 15px;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        .ratio {
            font-size: 1.15rem;
            font-weight: bold;
            color: #212529;
            margin-bottom: 6px;
        }
        .message {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* 황금비 보정 안내 박스 */
        .add-info {
            font-size: 0.82rem;
            color: #3b5bdb;
            background: #edf2ff;
            border: 1px solid #bac8ff;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            line-height: 1.4;
            text-align: left;
        }

        .default { color: #868e96; }
        .golden { color: #20c997; }
        .silver { color: #748ffc; } 
        .close { color: #fd7e14; }
        .not-golden { color: #fa5252; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 3개 선택 버튼 (탭 네비게이션) -->
        <div class="nav-tabs">
            <button class="nav-tab active" id="tabBtn0" onclick="setMode(0)">기본 계산기</button>
            <button class="nav-tab" id="tabBtn1" onclick="setMode(1)">비율 판별기</button>
            <button class="nav-tab" id="tabBtn2" onclick="setMode(2)">비례 길이</button>
        </div>

        <!-- 1. 기본 계산기 -->
        <div id="basicCalculator" class="animated-view">
            <h2>기본 계산기</h2>
            <input type="text" id="basicCalcScreen" readonly placeholder="0">
            
            <div class="keypad">
                <button class="clear" onclick="clearScreen()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('/')">÷</button>
                
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>
                
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">-</button>
                
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculateBasic()">=</button>
            </div>
        </div>

        <!-- 2. 비율 판별기 -->
        <div id="goldenCalculator" style="display: none;">
            <h2>비율 판별기</h2>
            
            <div class="input-group">
                <label for="width">가로 길이</label>
                <input type="number" id="width" placeholder="예: 1618 혹은 1414">
            </div>
            <div class="input-group">
                <label for="height">세로 길이</label>
                <input type="number" id="height" placeholder="예: 1000">
            </div>

            <button class="calc-btn" onclick="calculateGoldenRatio()">판별하기</button>

            <div class="result-box">
                <div class="ratio" id="ratioResult">비율: -</div>
                <div class="message default" id="feedbackMessage">길이를 입력하고 버튼을 눌러주세요.</div>
                
                <!-- 황금비 맞춤 추가 길이 안내 영역 -->
                <div class="add-info" id="goldenAddBox" style="display: none;"></div>
            </div>
        </div>

        <!-- 3. 비례 길이 계산기 -->
        <div id="proportionalCalculator" style="display: none;">
            <h2>비례 길이 계산기</h2>
            
            <div class="input-group">
                <label for="targetRatio">목표 비율</label>
                <select id="targetRatio">
                    <option value="1.618">황금비 (1 : 1.618)</option>
                    <option value="1.414">금강비 (1 : 1.414)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="knownLength">현재 변의 길이</label>
                <input type="number" id="knownLength" placeholder="예: 1000">
            </div>
            <div class="input-group">
                <label for="sideType">입력한 길이는 어떤 변인가요?</label>
                <select id="sideType">
                    <option value="short">짧은 변 기준 (긴 변 구하기)</option>
                    <option value="long">긴 변 기준 (짧은 변 구하기)</option>
                </select>
            </div>

            <button class="calc-btn" onclick="calculateProportional()">나머지 길이 구하기</button>

            <div class="result-box">
                <div class="ratio" id="propResult">나머지 길이: -</div>
                <div class="message default" id="propFeedback">옵션을 선택하고 길이를 입력해주세요.</div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 0; 
        const modes = ['basicCalculator', 'goldenCalculator', 'proportionalCalculator'];

        // 상단 탭 버튼 클릭 시 화면 전환
        function setMode(modeIndex) {
            if (currentMode === modeIndex) return;

            const currentDiv = document.getElementById(modes[currentMode]);
            currentDiv.classList.remove('animated-view');
            currentDiv.style.display = 'none';
            document.getElementById(`tabBtn${currentMode}`).classList.remove('active');

            currentMode = modeIndex;
            const nextDiv = document.getElementById(modes[currentMode]);
            nextDiv.style.display = 'block';
            void nextDiv.offsetWidth; 
            nextDiv.classList.add('animated-view');
            document.getElementById(`tabBtn${currentMode}`).classList.add('active');
        }

        // 1. 기본 계산기 로직
        const screen = document.getElementById('basicCalcScreen');

        function appendValue(value) {
            if (screen.value === 'Error') screen.value = '';
            screen.value += value;
        }

        function clearScreen() {
            screen.value = '';
        }

        function calculateBasic() {
            if (screen.value.trim() === '') return;
            try {
                const result = new Function('return ' + screen.value)(); 
                screen.value = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, '');
            } catch (error) {
                screen.value = 'Error';
            }
        }

        // 2. 비율 판별기 로직
        function calculateGoldenRatio() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const ratioResult = document.getElementById('ratioResult');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const goldenAddBox = document.getElementById('goldenAddBox');

            if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
                ratioResult.textContent = '비율: -';
                feedbackMessage.textContent = '올바른 길이를 입력해주세요.';
                feedbackMessage.className = 'message default';
                goldenAddBox.style.display = 'none';
                return;
            }

            const longSide = Math.max(width, height);
            const shortSide = Math.min(width, height);
            const ratio = longSide / shortSide;

            ratioResult.textContent = `비율 = 1 : ${ratio.toFixed(3)}`;

            const goldenRatio = 1.618;
            const silverRatio = 1.414;
            
            const goldenDiff = Math.abs(ratio - goldenRatio);
            const silverDiff = Math.abs(ratio - silverRatio);

            // 판별 메시지 출력
            if (goldenDiff <= 0.001) {
                feedbackMessage.textContent = '✨ 완벽한 황금비입니다!';
                feedbackMessage.className = 'message golden';
            } else if (silverDiff <= 0.001) {
                feedbackMessage.textContent = '💎 완벽한 금강비입니다!';
                feedbackMessage.className = 'message silver';
            } else if (goldenDiff <= 0.15 && goldenDiff < silverDiff) {
                feedbackMessage.textContent = '👍 황금비에 근접했습니다.';
                feedbackMessage.className = 'message close';
            } else if (silverDiff <= 0.15 && silverDiff < goldenDiff) {
                feedbackMessage.textContent = '👍 금강비에 근접했습니다.';
                feedbackMessage.className = 'message close';
            } else {
                feedbackMessage.textContent = '❌ 황금비/금강비가 아닙니다.';
                feedbackMessage.className = 'message not-golden';
            }

            // 황금비(1:1.618)를 만들기 위해 가로/세로에 얼마나 더 추가해야 하는지 계산
            goldenAddBox.style.display = 'block';

            if (goldenDiff <= 0.001) {
                goldenAddBox.innerHTML = '💡 <strong>황금비 팁:</strong> 이미 완벽한 황금비입니다!';
            } else {
                let addMsg = '';

                if (width === height) {
                    const addAmount = (width * 1.618 - width).toFixed(1);
                    addMsg = `💡 <strong>황금비(1:1.618) 팁:</strong><br>가로 또는 세로에 <strong>+${addAmount}</strong>를 추가해보세요.`;
                } else if (width > height) {
                    // 가로가 더 긴 상태
                    const targetWidth = height * 1.618;
                    if (width < targetWidth) {
                        const needAdd = (targetWidth - width).toFixed(1);
                        addMsg = `💡 <strong>황금비(1:1.618) 팁:</strong><br>가로에 <strong>+${needAdd}</strong>를 더 추가해보세요.`;
                    } else {
                        const targetHeight = width / 1.618;
                        const needAdd = (targetHeight - height).toFixed(1);
                        addMsg = `💡 <strong>황금비(1:1.618) 팁:</strong><br>세로에 <strong>+${needAdd}</strong>를 더 추가해보세요.`;
                    }
                } else {
                    // 세로가 더 긴 상태
                    const targetHeight = width * 1.618;
                    if (height < targetHeight) {
                        const needAdd = (targetHeight - height).toFixed(1);
                        addMsg = `💡 <strong>황금비(1:1.618) 팁:</strong><br>세로에 <strong>+${needAdd}</strong>를 더 추가해보세요.`;
                    } else {
                        const targetWidth = height / 1.618;
                        const needAdd = (targetWidth - width).toFixed(1);
                        addMsg = `💡 <strong>황금비(1:1.618) 팁:</strong><br>가로에 <strong>+${needAdd}</strong>를 더 추가해보세요.`;
                    }
                }
                goldenAddBox.innerHTML = addMsg;
            }
        }

        // 3. 비례 길이 계산기 로직
        function calculateProportional() {
            const targetRatio = parseFloat(document.getElementById('targetRatio').value);
            const knownLength = parseFloat(document.getElementById('knownLength').value);
            const sideType = document.getElementById('sideType').value;
            const propResult = document.getElementById('propResult');
            const propFeedback = document.getElementById('propFeedback');

            if (isNaN(knownLength) || knownLength <= 0) {
                propResult.textContent = '나머지 길이: -';
                propFeedback.textContent = '올바른 기준 길이를 입력해주세요.';
                propFeedback.className = 'message default';
                return;
            }

            let calculatedLength = 0;

            if (sideType === 'short') {
                calculatedLength = knownLength * targetRatio;
            } else {
                calculatedLength = knownLength / targetRatio;
            }

            propResult.textContent = `나머지 길이: ${calculatedLength.toFixed(1)}`;
            
            const ratioName = targetRatio === 1.618 ? '황금비' : '금강비';
            const colorClass = targetRatio === 1.618 ? 'golden' : 'silver';
            
            propFeedback.textContent = `입력하신 길이에 맞춘 ${ratioName}입니다.`;
            propFeedback.className = `message ${colorClass}`;
        }
    </script>

</body>
</html>
